apiVersion: v1
kind: Service
metadata:
  name: m8-pipeline-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m8-pipeline-engine
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
spec:
  # Headless for StatefulSet pod DNS.
  clusterIP: None
  selector:
    app: m8-pipeline-engine
  ports:
    - name: tls
      port: 8443
      targetPort: tls
      protocol: TCP
