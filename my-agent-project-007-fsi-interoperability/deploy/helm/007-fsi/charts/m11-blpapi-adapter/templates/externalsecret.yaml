apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Vault convention: secret/data/007/<module>/<leaf>.
    # Adapter reads these as STRING PATHS (env BLPAPI_UUID_VAULT_PATH etc.);
    # the real runtime fetches the values via Vault at startup. The
    # ExternalSecret also mirrors the values into an env-backed Secret so
    # operators using env-only deployments (dev clusters) can wire the
    # adapter without a live Vault.
    - secretKey: BLPAPI_UUID
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-blpapi-adapter" }}/uuid
        property: value
    - secretKey: BLPAPI_SERIAL
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-blpapi-adapter" }}/serial
        property: value
