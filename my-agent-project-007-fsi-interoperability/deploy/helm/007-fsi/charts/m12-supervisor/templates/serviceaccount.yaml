apiVersion: v1
kind: ServiceAccount
metadata:
  name: m12-supervisor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m12-supervisor
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
  annotations:
    # IRSA (R4.3) -- Bedrock access via IAM role, never baked keys.
    eks.amazonaws.com/role-arn: {{ .Values.irsa.roleArn | quote }}
automountServiceAccountToken: true
