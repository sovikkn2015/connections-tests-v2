apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m6-mcp-gateway/redis-auth" }}
        property: url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m6-mcp-gateway/redis-auth" }}
        property: password
    - secretKey: AID_PUBLIC_KEY_PEM
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m6-mcp-gateway/redis-auth" }}
        property: aid_public_key
