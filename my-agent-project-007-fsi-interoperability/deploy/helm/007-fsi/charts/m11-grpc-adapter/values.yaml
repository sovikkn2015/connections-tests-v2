# -----------------------------------------------------------------------------
# M11 gRPC Adapter (ICE Data) -- disabled by default.
# -----------------------------------------------------------------------------

enabled: false

replicaCount: 2

image:
  repository: 007-fsi/m11-grpc-adapter
  tag: latest
  pullPolicy: Always

service:
  appPort: 8443
  probePort: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  minAvailable: 1

tmpVolumes:
  - name: tmp
    mountPath: /tmp
  - name: grpc-cache
    mountPath: /home/m11grpc

ice:
  enabled: false
  target: "icedata.example.invalid:443"
  tenantId: "default-tenant"
  channelPoolSize: 4
  channelIdleS: 300
  circuitThreshold: 5
  circuitCooldownMs: 30000
  rateLimit:
    rpm: 1200
    burst: 100

externalSecretPath: secret/data/007/m11-grpc-adapter
