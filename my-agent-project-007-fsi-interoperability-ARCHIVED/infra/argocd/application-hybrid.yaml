# Project 007 FSI Platform — ArgoCD Application (Hybrid Topology)
# Rule 25: Hybrid topology for Tier 1/2 firms.
# Topology: Hybrid — Strands SDK runtime, self-hosted or Bedrock via VPN LLM
# Uses values-hybrid.yaml instead of values-cloud.yaml.
#
# Key differences from cloud:
#   - Strands SDK runtime (not Managed Agents)
#   - PostgreSQL for checkpoints (not DynamoDB)
#   - MinIO for WORM tier (not S3 Object Lock)
#   - M13 FIX Bridge enabled (StatefulSet)
#   - Reduced replicas (on-prem resource constraints)
#
# Sync Wave Order (same as cloud — ordered deployment):
#   Wave 0: Infrastructure (PostgreSQL, Redis, OPA, MinIO, Langfuse, Keycloak)
#   Wave 1: Trust Layer (M1 Identity, M2/M4 Policy, M10 Audit)
#   Wave 2: Gateway (M6 MCP Gateway)
#   Wave 3: Intelligence Layer (M8 Pipeline, M9 Intent Router, Specialists)
#   Wave 4: Adapters + FIX Bridge (M11, M13)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 007-fsi-platform-hybrid
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: 007-fsi-platform
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: hybrid-topology
    project007.fsi/topology: hybrid
    project007.fsi/tier: "1-2"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "007-deployments"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "007-deployments"
    notifications.argoproj.io/subscribe.on-health-degraded.slack: "007-alerts"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: 007-fsi-platform
  source:
    repoURL: <REPO_URL>
    targetRevision: main
    path: my-agent-project-007-fsi-interoperability/infra/helm/007-platform
    helm:
      valueFiles:
        - values.yaml
        - values-hybrid.yaml
      parameters:
        - name: global.imageTag
          value: ""
        - name: global.imageRegistry
          value: ""
        - name: global.storageClass
          value: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: fsi-007-hybrid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
