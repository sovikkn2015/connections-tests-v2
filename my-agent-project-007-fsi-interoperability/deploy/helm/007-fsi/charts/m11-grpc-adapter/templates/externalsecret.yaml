apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ICE_BEARER_TOKEN
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-grpc-adapter" }}/bearer
        property: value
    - secretKey: ICE_MTLS_CERT
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-grpc-adapter" }}/mtls/cert
        property: value
    - secretKey: ICE_MTLS_KEY
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-grpc-adapter" }}/mtls/key
        property: value
    - secretKey: ICE_MTLS_CA
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m11-grpc-adapter" }}/mtls/ca
        property: value
