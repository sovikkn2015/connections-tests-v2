# ==========================================================================
# Telegram Channel — FSI Research Agent
# Project 006: OpenClaw + Salesforce + AWS
#
# Prerequisites:
#   1. Message @BotFather on Telegram to create a new bot
#   2. Save the bot token BotFather gives you
#   3. Set the webhook URL to OpenClaw's gateway endpoint:
#      curl -X POST "https://api.telegram.org/bot<TOKEN>/setWebhook" \
#        -d "url=https://<OPENCLAW_GATEWAY>/webhook/telegram"
#   4. Store the bot token in AWS Secrets Manager or environment variables
#
# Setup guide: https://docs.openclaw.ai/channels/telegram
# ==========================================================================

type: telegram
enabled: true

config:
  # Bot Token — from @BotFather after creating the bot
  bot_token: "${TELEGRAM_BOT_TOKEN}"

  # Default agent to route messages to
  default_agent: "fsi-research"
