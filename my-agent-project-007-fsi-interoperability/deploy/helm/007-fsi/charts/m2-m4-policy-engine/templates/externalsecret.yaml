apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPA_BUNDLE_TOKEN
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m2-m4-policy-engine/opa-auth" }}
        property: bundle_token
    - secretKey: OPA_BUNDLE_URL
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m2-m4-policy-engine/opa-auth" }}
        property: bundle_url
