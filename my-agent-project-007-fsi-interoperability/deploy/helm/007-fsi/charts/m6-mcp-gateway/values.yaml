# -----------------------------------------------------------------------------
# M6 MCP Gateway sub-chart values.
#
# M6 is the only horizontally-scaled service in Wave 1 -- M1, M2/M4, M10 are
# low-volume trust infrastructure with stable 2-replica baselines.
# -----------------------------------------------------------------------------

replicaCount: 2

image:
  repository: 007-fsi/m6-mcp-gateway
  tag: latest
  pullPolicy: Always

service:
  appPort: 8443
  probePort: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  minAvailable: 1

tmpVolumes:
  - name: tmp
    mountPath: /tmp
  - name: uvicorn-cache
    mountPath: /home/m6

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

externalSecretPath: secret/data/007/m6-mcp-gateway/redis-auth

# Wave 4 egress narrowing.
egressAllowlist: []

networkPolicy:
  # egressMode: allowlist|allow-all  -- leave unset to inherit global
