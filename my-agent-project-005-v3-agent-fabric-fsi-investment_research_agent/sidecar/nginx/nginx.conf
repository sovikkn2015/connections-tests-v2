# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Host / SNI rewriting proxy for V3-B Flex Gateway sidecar.
#
# Flex Gateway (Envoy) connects to http://127.0.0.1:8080/... (or
# http://localhost:8080/...) inside the ECS task. Every request is forwarded
# upstream to the V2 API Gateway EDGE URL with the Host header and TLS SNI
# set to the API Gateway hostname so CloudFront accepts it.
#
# All client headers (x-api-key, X-Correlation-Id, X-Agent-Id, X-Tool-Name,
# etc.) are forwarded unchanged via `proxy_pass_request_headers on`.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Minimal MIME + defaults.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log to stdout so CloudWatch captures it.
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_x_correlation_id" "$http_x_agent_id" '
                      '"$http_x_tool_name" ua="$http_user_agent"';
    access_log  /dev/stdout  main;

    # Use ECS task-local DNS. Re-resolve every 30s so that if API Gateway's
    # backing IPs change, we don't stick to a stale one.
    resolver  169.254.169.253  valid=30s ipv6=off;

    sendfile      on;
    keepalive_timeout  65;

    # Single virtual server: bind 8080 on every interface so both
    # 127.0.0.1:8080 and the awsvpc task IP work.
    server {
        listen       8080;
        server_name  _;

        # Readiness probe for the ECS healthcheck, if we ever add one.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Flex Gateway sends the literal template string "/{+wildcard}"
        # prefixed to the real path (the destinationPath interpolation
        # doesn't fire for plain http upstreams). Strip it here so the
        # real path reaches CloudFront/APIGW.
        location ~ ^/\{\+wildcard\}(.*)$ {
            set $stripped_uri /$1$is_args$args;

            proxy_set_header  Host  og256a1neb.execute-api.us-east-1.amazonaws.com;
            proxy_pass_request_headers  on;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  X-Forwarded-Host  $host;

            proxy_ssl_server_name  on;
            proxy_ssl_name         og256a1neb.execute-api.us-east-1.amazonaws.com;
            proxy_ssl_protocols    TLSv1.2 TLSv1.3;
            proxy_ssl_verify       off;

            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            proxy_pass  https://og256a1neb.execute-api.us-east-1.amazonaws.com/prod$stripped_uri;
        }

        # Fallback: direct path (no wildcard prefix) — straight proxy.
        location / {
            # Upstream is CloudFront-fronted; Host header MUST be the
            # APIGW hostname or CloudFront returns 400.
            proxy_set_header  Host  og256a1neb.execute-api.us-east-1.amazonaws.com;

            # Preserve all inbound headers, including x-api-key added by
            # the Flex Gateway header-injection policy.
            proxy_pass_request_headers  on;

            # Forward the caller identity so the V2 APIGW access logs
            # attribute correctly. Leave x-api-key alone (arrives from Flex).
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  X-Forwarded-Host  $host;

            # Upstream TLS: SNI must match the APIGW hostname.
            proxy_ssl_server_name  on;
            proxy_ssl_name         og256a1neb.execute-api.us-east-1.amazonaws.com;
            proxy_ssl_protocols    TLSv1.2 TLSv1.3;
            # APIGW's cert is valid, but hostname-verification against
            # CloudFront's cluster is fragile; keep verify off — the call
            # is already authenticated by x-api-key at the edge.
            proxy_ssl_verify       off;

            # Timeouts tuned for MCP tool calls (some SEC EDGAR pulls
            # take ~10s).
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Preserve the incoming request URI under /prod.
            # $request_uri contains the full original path + query, e.g.
            #   POST /sec-edgar/tools/list   ->   /prod/sec-edgar/tools/list
            proxy_pass  https://og256a1neb.execute-api.us-east-1.amazonaws.com/prod$request_uri;
        }
    }
}
