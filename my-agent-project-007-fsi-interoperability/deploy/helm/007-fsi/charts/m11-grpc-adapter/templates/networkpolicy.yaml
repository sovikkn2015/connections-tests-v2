apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m6-mcp-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
  egress:
    # Allow outbound to Vault + ICE Data target. Narrower egress lands in the
    # egress-hardening wave.
    - {}
