apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "007.serviceAccountName" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ (.Values.global).tenantRoleArn | default "arn:aws:iam::000000000000:role/placeholder" | quote }}
    iam.gke.io/gcp-service-account: "m11-blpapi-adapter@PROJECT.iam.gserviceaccount.com"
automountServiceAccountToken: true
