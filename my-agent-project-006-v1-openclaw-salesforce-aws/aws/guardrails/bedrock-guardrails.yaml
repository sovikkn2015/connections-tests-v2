AWSTemplateFormatVersion: '2010-09-09'
Description: Bedrock Guardrails for Project 006 — PII masking, toxicity, denied topics, prompt injection

Resources:
  FSIGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: fsi-research-guardrail
      Description: FSI investment research guardrail — PII masking, toxicity filtering, denied topics, prompt attack detection
      BlockedInputMessaging: "This request has been blocked by our compliance guardrails."
      BlockedOutputsMessaging: "This response has been blocked by our compliance guardrails."
      
      # PII masking — mask sensitive data before it reaches the LLM
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: NAME
            Action: ANONYMIZE
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
          - Type: US_BANK_ACCOUNT_NUMBER
            Action: BLOCK
          - Type: DRIVER_ID
            Action: ANONYMIZE
          - Type: US_PASSPORT_NUMBER
            Action: BLOCK
          - Type: US_INDIVIDUAL_TAX_IDENTIFICATION_NUMBER
            Action: BLOCK
        RegexesConfig:
          - Name: CUSIP
            Description: CUSIP security identifier with check digit validation
            Pattern: "\\b[0-9]{3}[A-Z0-9]{5}[0-9]\\b"
            Action: ANONYMIZE
          - Name: ISIN
            Description: ISIN with country code prefix
            Pattern: "\\b(US|CA|GB|DE|FR|JP|AU|CH)[0-9A-Z]{10}\\b"
            Action: ANONYMIZE
          - Name: AccountNumber
            Description: Internal account numbers
            Pattern: "\\b[A-Z]-BROKERAGE-[0-9]{3}\\b"
            Action: ANONYMIZE
          - Name: SWIFTCode
            Description: SWIFT/BIC bank identifier
            Pattern: "\\b[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?\\b"
            Action: ANONYMIZE
          - Name: RoutingNumber
            Description: ABA routing number (9 digits)
            Pattern: "\\b[0-9]{9}\\b"
            Action: ANONYMIZE
      
      # Content filtering — block harmful content
      ContentPolicyConfig:
        FiltersConfig:
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      
      # Denied topics — block requests about insider trading, unauthorized actions
      TopicPolicyConfig:
        TopicsConfig:
          - Name: InsiderTrading
            Definition: "Requests for material non-public information, insider trading tips, or attempts to access pre-announcement data"
            Examples:
              - "Tell me NVIDIA's earnings before they announce"
              - "What insider information do you have about the merger"
              - "Give me the preliminary revenue numbers"
            Type: DENY
          - Name: UnauthorizedTrading
            Definition: "Requests to execute trades without proper authorization or to bypass compliance controls"
            Examples:
              - "Execute this trade without compliance check"
              - "Skip the approval process and sell immediately"
              - "Trade after hours when compliance isn't watching"
            Type: DENY
          - Name: DataDeletion
            Definition: "Requests to delete audit logs, compliance records, or other regulatory data"
            Examples:
              - "Delete all audit logs from last month"
              - "Remove the compliance records for this trade"
              - "Clear the MNPI flags"
            Type: DENY

  FSIGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !Ref FSIGuardrail
      Description: "v1 — initial FSI guardrail"

Outputs:
  GuardrailId:
    Value: !Ref FSIGuardrail
  GuardrailArn:
    Value: !GetAtt FSIGuardrail.GuardrailArn
  GuardrailVersionId:
    Value: !Ref FSIGuardrailVersion
