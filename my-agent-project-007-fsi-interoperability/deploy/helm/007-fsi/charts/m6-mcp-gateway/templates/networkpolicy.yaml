{{- /*
Wave 4 egress narrowing. Spec: .kiro/specs/ops-hardening-wave4-egress-narrowing.md.
M6 MCP Gateway egress allowlist covers M1/M2-M4/M10 intra-cluster plus a
per-vendor MCP endpoint allowlist (the hybrid values file additionally
appends the on-prem adapter ingest FQDN).
*/}}
{{- $mode := "allow-all" -}}
{{- if and .Values.global .Values.global.networkPolicy .Values.global.networkPolicy.egressMode -}}
{{-   $mode = .Values.global.networkPolicy.egressMode -}}
{{- end -}}
{{- if and .Values.networkPolicy .Values.networkPolicy.egressMode -}}
{{-   $mode = .Values.networkPolicy.egressMode -}}
{{- end -}}
{{- $allowlist := default list .Values.egressAllowlist -}}
{{- if and (eq $mode "allowlist") (eq (len $allowlist) 0) -}}
{{-   fail "M6 MCP gateway egressAllowlist must be non-empty in allowlist mode. See deploy/helm/007-fsi/VALUES-EGRESS-README.md." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # M6 is the platform entrypoint. Any pod labelled as part of 007-fsi
    # can reach M6 on its app port. Cross-namespace traffic lands via the
    # service mesh which labels pods app.kubernetes.io/part-of.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: 007-fsi
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
    # Kubelet probes.
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
  egress:
    # Mandatory DNS egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if eq $mode "allow-all" }}
    - {}
{{- else }}
  {{- range $allowlist }}
    - to:
      {{- if .host }}
        - ipBlock:
            cidr: {{ .host }}/32
      {{- else if .namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      {{- else }}
        {{- fail "egressAllowlist entry must have host OR namespace+podLabels" }}
      {{- end }}
      ports:
        - protocol: {{ default "TCP" .protocol }}
          port: {{ .port }}
  {{- end }}
{{- end }}
