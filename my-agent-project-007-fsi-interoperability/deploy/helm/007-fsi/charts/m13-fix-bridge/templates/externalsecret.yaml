apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # FIX session config YAML (list of VenueConfig per Spec §R4.1).
    - secretKey: FIX_SESSIONS_CONFIG
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m13-fix-bridge" }}/sessions
        property: value
    # Tenant-specific salt for drop-copy account hashing (Spec §R6.3).
    - secretKey: FIX_ACCOUNT_HASH_SALT
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m13-fix-bridge" }}/account_hash_salt
        property: value
    # AID verify HMAC shared secret (Spec §R13.5, HMAC mode).
    - secretKey: FIX_AID_VERIFY_SHARED_SECRET
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m13-fix-bridge" }}/aid_verify_secret
        property: value
