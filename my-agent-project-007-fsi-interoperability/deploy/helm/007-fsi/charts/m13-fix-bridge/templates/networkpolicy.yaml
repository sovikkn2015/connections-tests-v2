apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only M6 MCP gateway may call the bridge (Steering Rule 4 -- every
    # MCP call passes through M6).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m6-mcp-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
    # Kubelet probes accept from any pod on the probe port.
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
  egress:
    {{- if eq ((.Values.global).networkPolicy).egressMode "allowlist" }}
    # Wave-4 allowlist mode -- explicit egress per FIX venue + Vault + DNS.
    # DNS -- kube-dns on UDP/TCP 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.egressAllowlist }}
    - to:
        {{- if .host }}
        - ipBlock:
            cidr: {{ .host }}/32
        {{- else if .namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- if .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
    {{- end }}
    {{- else }}
    # Wave 1/2 compatibility -- open egress. Narrowed in the
    # egress-hardening wave (Rule 22).
    - {}
    {{- end }}
