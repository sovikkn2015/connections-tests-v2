apiVersion: v1
kind: ConfigMap
metadata:
  name: m12-supervisor-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m12-supervisor
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
data:
  # Non-secret runtime config (R3.19-R3.25, R4.8).
  # M12_KYC_ADAPTER_URL is a URL (NOT secret); the key behind it is in Vault.
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  M12_MODEL_ID: {{ .Values.config.modelId | quote }}
  M12_KYC_ADAPTER_URL: {{ .Values.config.kycAdapterUrl | quote }}
  M12_HITL_HMAC_KEY_VAULT_PATH: {{ .Values.config.hitlHmacKeyVaultPath | quote }}
  M12_M9_BASE_URL: {{ .Values.config.m9BaseUrl | quote }}
  M12_M8_BASE_URL: {{ .Values.config.m8BaseUrl | quote }}
  M12_DISPATCH_MODE: {{ .Values.config.dispatchMode | quote }}
  schemaVersion: {{ .Values.config.schemaVersion | quote }}
  configSchemaVersion: {{ .Values.config.configSchemaVersion | quote }}
