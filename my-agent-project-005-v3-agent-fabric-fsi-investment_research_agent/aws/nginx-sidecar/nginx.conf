# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Host / SNI rewriting proxy for the V3-B Flex Gateway sidecar.
#
# This nginx runs as a sidecar in the ir-flex-gateway-task ECS task,
# sharing the awsvpc network namespace with flex-gateway + config-sync.
# Flex Gateway (Envoy) forwards requests to http://127.0.0.1:8082/...;
# we rewrite Host + SNI to the V2 API Gateway hostname so CloudFront
# (which fronts the EDGE-optimized V2 APIGW) accepts the request.
#
# SECURITY POSTURE
# ----------------
#  • Listen on 127.0.0.1:8082 only. Because the task shares a network
#    namespace, flex-gateway can reach us over loopback without opening
#    any port externally.
#  • proxy_ssl_verify on + ca-certificates bundle — a rogue upstream
#    must fail the TLS handshake. No silent downgrade.
#  • proxy_ssl_server_name + proxy_ssl_name set SNI correctly for the
#    CloudFront distribution in front of the APIGW.
#  • x-api-key / x-agent-id / x-correlation-id / x-tool-name forwarded
#    verbatim. Flex injects x-api-key via its header-injection policy;
#    we do NOT touch or log the secret value.
#
# See docs/v3-b-nginx-sidecar.md for the architecture and rotate/rollback
# runbooks. See docs/v3-b-infra-debug-findings.md for why we went Option C.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log format tuned for FINRA audit correlation. Flex emits
    # its own audit line per request; we emit a mirror at the sidecar
    # with the same x-correlation-id so the two can be stitched together
    # in CloudWatch Insights by correlation_id.
    log_format  audit  '$remote_addr - [$time_iso8601] '
                       '"$request" $status '
                       'upstream=$upstream_response_time '
                       'cid="$http_x_correlation_id" '
                       'agent="$http_x_agent_id" '
                       'tool="$http_x_tool_name" '
                       'bytes=$body_bytes_sent';
    access_log  /dev/stdout  audit;

    # ECS task-local resolver. APIGW/CloudFront IPs change, so re-resolve
    # every 30s rather than caching forever.
    resolver  169.254.169.253  valid=30s ipv6=off;

    sendfile           on;
    keepalive_timeout  65;

    # Disable client-side body size limits — SEC EDGAR tool responses
    # can be large JSON blobs.
    client_max_body_size  10m;

    server {
        # Loopback-only. Defense-in-depth: even if the task SG is
        # misconfigured, nothing outside the task's network namespace
        # can reach this port.
        listen       127.0.0.1:8082;
        server_name  _;

        # Healthcheck endpoint — used by the Dockerfile HEALTHCHECK and
        # the ECS essential=true + dependsOn=HEALTHY gate. Does NOT
        # call upstream, so it stays green during APIGW blips.
        location = /healthz {
            access_log  off;
            add_header  Content-Type  text/plain;
            return      200 "ok\n";
        }

        # Flex Gateway uses destinationPath "/{+wildcard}" against a
        # plain-HTTP upstream. Envoy does not template-expand the
        # placeholder in that mode, so the literal string "/{+wildcard}/..."
        # arrives here. Strip it before handing to APIGW.
        location ~ ^/\{\+wildcard\}(?<rest>.*)$ {
            set  $upstream_path  /$rest$is_args$args;

            # Critical: upstream Host must be the APIGW hostname so
            # CloudFront routes to the right distribution.
            proxy_set_header  Host  og256a1neb.execute-api.us-east-1.amazonaws.com;

            # Forward all inbound headers (x-api-key, x-agent-id,
            # x-correlation-id, x-tool-name) verbatim.
            proxy_pass_request_headers  on;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host   $host;

            # Upstream TLS hardening.
            proxy_ssl_server_name         on;
            proxy_ssl_name                og256a1neb.execute-api.us-east-1.amazonaws.com;
            proxy_ssl_protocols           TLSv1.2 TLSv1.3;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;

            proxy_pass  https://og256a1neb.execute-api.us-east-1.amazonaws.com/prod$upstream_path;
        }

        # Direct path fallback (no template prefix) — same rewrite rules.
        location / {
            proxy_set_header  Host  og256a1neb.execute-api.us-east-1.amazonaws.com;

            proxy_pass_request_headers  on;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host   $host;

            proxy_ssl_server_name         on;
            proxy_ssl_name                og256a1neb.execute-api.us-east-1.amazonaws.com;
            proxy_ssl_protocols           TLSv1.2 TLSv1.3;
            proxy_ssl_verify              on;
            proxy_ssl_verify_depth        4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;

            # $request_uri preserves the full original path + query.
            proxy_pass  https://og256a1neb.execute-api.us-east-1.amazonaws.com/prod$request_uri;
        }
    }
}
