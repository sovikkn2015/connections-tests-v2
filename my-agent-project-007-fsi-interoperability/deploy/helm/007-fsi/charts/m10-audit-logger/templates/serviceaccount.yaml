apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "007.serviceAccountName" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
  annotations:
    # Per-tenant KMS key reference (Steering Rule 23). The IAM role under
    # this ARN owns the per-tenant KMS CMK and is assumed by pods via
    # IRSA. The chart does NOT create the role or key -- those are
    # Terraformed per tenant.
    eks.amazonaws.com/role-arn: {{ (.Values.global).tenantRoleArn | default "arn:aws:iam::000000000000:role/placeholder" | quote }}
    # GKE equivalent (Workload Identity) -- set by overlay when deploying
    # to GKE instead of EKS.
    iam.gke.io/gcp-service-account: "trust-layer@PROJECT.iam.gserviceaccount.com"
automountServiceAccountToken: true
