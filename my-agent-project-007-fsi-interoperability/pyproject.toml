[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-007-fsi-interoperability"
version = "0.1.0"
description = "Project 007 — FSI Interoperability Platform (trust layer + canonical schema + policy engine)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = [
    "integration: end-to-end integration tests (require external services; skipped when unavailable)",
    "perf: performance / throughput tests (skipped by default in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:jose.*",
]
