apiVersion: apps/v1
kind: Deployment
metadata:
  name: m9-intent-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m9-intent-router
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: m9-intent-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: m9-intent-router
        app.kubernetes.io/name: m9-intent-router
        app.kubernetes.io/part-of: 007-fsi
        app.kubernetes.io/component: intelligence
    spec:
      serviceAccountName: m9-intent-router
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: m9-intent-router
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: tls
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: m9-intent-router-config
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: tls
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: tls
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: mtls-cert
              mountPath: /etc/007/mtls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mtls-cert
          secret:
            secretName: {{ .Values.mtls.secretName }}
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
