apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "007.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "007.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # SIGTERM grace period matches the session-drain budget documented
      # in the spec (§5.2 -- BLPAPI session stop + flush).
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "007.image" . | quote }}
          imagePullPolicy: {{ include "007.imagePullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.probePort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.service.probePort | quote }}
            - name: BLPAPI_ENABLED
              value: {{ .Values.blpapi.enabled | quote }}
            - name: BLPAPI_HOST
              value: {{ .Values.blpapi.host | quote }}
            - name: BLPAPI_PORT
              value: {{ .Values.blpapi.port | quote }}
            - name: BLPAPI_CLIENT_MODE
              value: {{ .Values.blpapi.clientMode | quote }}
            - name: BLPAPI_SESSION_TIMEOUT_MS
              value: {{ .Values.blpapi.sessionTimeoutMs | quote }}
            - name: BLPAPI_CIRCUIT_THRESHOLD
              value: {{ .Values.blpapi.circuitThreshold | quote }}
            - name: BLPAPI_CIRCUIT_COOLDOWN_MS
              value: {{ .Values.blpapi.circuitCooldownMs | quote }}
            - name: BLPAPI_RATE_LIMIT_RPM
              value: {{ .Values.blpapi.rateLimit.rpm | quote }}
            - name: BLPAPI_RATE_LIMIT_BURST
              value: {{ .Values.blpapi.rateLimit.burst | quote }}
            - name: BLPAPI_UUID_VAULT_PATH
              value: "{{ .Values.externalSecretPath }}/uuid"
            - name: BLPAPI_SERIAL_VAULT_PATH
              value: "{{ .Values.externalSecretPath }}/serial"
            - name: BLPAPI_SECRETS_BACKEND
              value: "vault"
            - name: MTLS_CERT_PATH
              value: /etc/007/mtls/tls.crt
            - name: MTLS_KEY_PATH
              value: /etc/007/mtls/tls.key
            - name: MTLS_CA_PATH
              value: /etc/007/mtls/ca.crt
            - name: VAULT_TOKEN_PATH
              value: /var/run/secrets/vault/token
          envFrom:
            - secretRef:
                name: {{ include "007.fullname" . }}-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.probePort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.probePort }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: mtls
              mountPath: /etc/007/mtls
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            {{- range .Values.tmpVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: mtls
          secret:
            secretName: {{ include "007.fullname" . }}-mtls
            defaultMode: 0400
            optional: true
        - name: vault-token
          secret:
            secretName: {{ include "007.fullname" . }}-vault-token
            defaultMode: 0400
            optional: true
        {{- range .Values.tmpVolumes }}
        - name: {{ .name }}
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- end }}
