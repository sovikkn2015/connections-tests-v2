[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m7-schema-translators"
version = "0.1.0"
description = "M7 Schema Translators — 11 translator pairs for Project 007 FSI"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0"]
