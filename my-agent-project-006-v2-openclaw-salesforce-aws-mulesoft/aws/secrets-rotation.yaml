AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Automated Salesforce token rotation for OpenClaw FSI (Project 006).
  Rotates SF_ACCESS_TOKEN in Secrets Manager every 12 hours via
  EventBridge + Lambda. Deploy with:
    aws cloudformation deploy --template-file secrets-rotation.yaml \
      --stack-name openclaw-006-sf-rotation \
      --capabilities CAPABILITY_IAM

Parameters:
  SecretName:
    Type: String
    Default: openclaw-fsi-secrets
    Description: Secrets Manager secret name containing SF_ACCESS_TOKEN

  RotationSchedule:
    Type: String
    Default: "rate(12 hours)"
    Description: EventBridge schedule expression for rotation frequency

Resources:

  # -------------------------------------------------------------------
  # IAM Role for the rotation Lambda
  # -------------------------------------------------------------------
  RotationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*"

  # -------------------------------------------------------------------
  # Lambda function — inline Python for SF token rotation
  # -------------------------------------------------------------------
  SfTokenRotationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-rotate"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt RotationLambdaRole.Arn
      Environment:
        Variables:
          SECRET_NAME: !Ref SecretName
      Tags:
        - Key: Project
          Value: 006-fsi
        - Key: Environment
          Value: production
      Code:
        ZipFile: |
          """Rotate Salesforce access token in Secrets Manager.

          Reads the current secret, calls SF OAuth2 token endpoint to get
          a fresh access token, and updates only SF_ACCESS_TOKEN in the
          secret. Logs success/failure to CloudWatch.
          """
          import json
          import logging
          import os
          import urllib.request
          import urllib.parse
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          sm = boto3.client("secretsmanager")


          def handler(event, context):
              secret_name = os.environ["SECRET_NAME"]
              logger.info("Starting SF token rotation for secret: %s", secret_name)

              # 1. Read current secret
              resp = sm.get_secret_value(SecretId=secret_name)
              secret = json.loads(resp["SecretString"])

              instance_url = secret.get("SF_INSTANCE_URL", "")
              current_token = secret.get("SF_ACCESS_TOKEN", "")

              if not instance_url or not current_token:
                  msg = "Missing SF_INSTANCE_URL or SF_ACCESS_TOKEN in secret"
                  logger.error(msg)
                  return {"statusCode": 400, "body": msg}

              # 2. Refresh or validate the token
              new_token = _refresh_token(instance_url, current_token, secret)

              if not new_token:
                  msg = "Token still valid or refresh unavailable — no update needed"
                  logger.info(msg)
                  return {"statusCode": 200, "body": msg}

              # 3. Update only SF_ACCESS_TOKEN
              secret["SF_ACCESS_TOKEN"] = new_token
              sm.put_secret_value(
                  SecretId=secret_name,
                  SecretString=json.dumps(secret),
              )

              logger.info(
                  "SF token rotated successfully (%d chars)", len(new_token)
              )
              return {"statusCode": 200, "body": "Token rotated"}


          def _refresh_token(instance_url, current_token, secret):
              """Try refresh_token flow first, fall back to session validation."""
              refresh_token = secret.get("SF_REFRESH_TOKEN", "")
              client_id = secret.get("SF_CLIENT_ID", "")
              client_secret = secret.get("SF_CLIENT_SECRET", "")

              # Preferred: OAuth2 refresh_token grant
              if refresh_token and client_id:
                  try:
                      data = urllib.parse.urlencode({
                          "grant_type": "refresh_token",
                          "client_id": client_id,
                          "client_secret": client_secret,
                          "refresh_token": refresh_token,
                      }).encode()
                      url = f"{instance_url}/services/oauth2/token"
                      req = urllib.request.Request(url, data=data, method="POST")
                      req.add_header("Content-Type", "application/x-www-form-urlencoded")
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          body = json.loads(resp.read())
                          token = body.get("access_token", "")
                          if token:
                              logger.info("Token refreshed via refresh_token grant")
                              return token
                  except Exception as e:
                      logger.warning("refresh_token grant failed: %s", e)

              # Fallback: validate current token is still alive
              try:
                  url = f"{instance_url}/services/oauth2/userinfo"
                  req = urllib.request.Request(url)
                  req.add_header("Authorization", f"Bearer {current_token}")
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      if resp.status == 200:
                          logger.info("Current token still valid")
                          return None  # None = keep current
              except Exception as e:
                  logger.warning("Token validation failed: %s", e)

              return None

  # -------------------------------------------------------------------
  # EventBridge rule — triggers rotation every 12 hours
  # -------------------------------------------------------------------
  RotationScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: "Trigger SF token rotation every 12 hours"
      ScheduleExpression: !Ref RotationSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt SfTokenRotationFunction.Arn
          Id: SfTokenRotationTarget

  # Permission for EventBridge to invoke the Lambda
  RotationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SfTokenRotationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RotationScheduleRule.Arn

Outputs:
  RotationFunctionArn:
    Description: ARN of the SF token rotation Lambda
    Value: !GetAtt SfTokenRotationFunction.Arn

  RotationScheduleRuleArn:
    Description: ARN of the EventBridge rotation schedule
    Value: !GetAtt RotationScheduleRule.Arn

  RotationRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt RotationLambdaRole.Arn
