apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only M6 MCP gateway may call the adapter (Steering Rule 4 -- every MCP
    # call via M6).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m6-mcp-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
    # Kubelet probes -- accept from any pod on the probe port. Health + startup.
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.probePort }}
  egress:
    # Allow outbound to cluster DNS + Vault + the configured Bloomberg host.
    # Narrower egress lands in the egress-hardening wave (Rule 22).
    - {}
