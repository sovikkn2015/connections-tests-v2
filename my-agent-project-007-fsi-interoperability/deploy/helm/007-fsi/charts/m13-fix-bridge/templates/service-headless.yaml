apiVersion: v1
kind: Service
metadata:
  name: {{ include "007.headlessServiceName" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  # Headless service for stable per-pod DNS under the StatefulSet.
  clusterIP: None
  selector:
    {{- include "007.selectorLabels" . | nindent 4 }}
  ports:
    - name: probe
      port: {{ .Values.service.probePort }}
      targetPort: {{ .Values.service.probePort }}
      protocol: TCP
