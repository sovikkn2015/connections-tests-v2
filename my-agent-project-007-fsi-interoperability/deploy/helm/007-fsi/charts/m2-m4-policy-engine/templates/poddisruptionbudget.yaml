apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "007.fullname" . }}
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "007.selectorLabels" . | nindent 6 }}
