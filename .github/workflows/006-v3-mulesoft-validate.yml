# Project 006 v3 — MuleSoft app packaging validation.
# Catches the class of bug that caused the live-demo CloudHub CrashLoopBackOff:
# config-parse errors, missing DataWeave resources, malformed mule-artifact.json.
#
# Every push that touches the Mule subtree triggers `mvn verify` against both
# process APIs. A failure here blocks merge, not demo day.
#
# See: my-agent-project-006-v3-openclaw-salesforce-aws-mulesoft/docs/v3-mulesoft-boot-crash-remediation.md

name: "006 v3 MuleSoft Validate"

on:
  push:
    paths:
      - "my-agent-project-006-v3-openclaw-salesforce-aws-mulesoft/mulesoft/**"
    branches: [main]
  pull_request:
    paths:
      - "my-agent-project-006-v3-openclaw-salesforce-aws-mulesoft/mulesoft/**"

env:
  MULE_ROOT: my-agent-project-006-v3-openclaw-salesforce-aws-mulesoft/mulesoft/process-apis

permissions:
  contents: read

jobs:

  # ── 1. Package both Mule apps ────────────────────────────────
  package:
    name: "mvn verify — ${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [submit-order, initiate-wire, order-status-webhook]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configure Maven settings for Anypoint Exchange
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>\${env.ANYPOINT_USERNAME}</username>
                <password>\${env.ANYPOINT_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Package (compile + validate artifact)
        working-directory: ${{ env.MULE_ROOT }}/${{ matrix.app }}
        run: mvn -B -e clean package -DskipTests

      - name: Verify expected resources are in the jar
        working-directory: ${{ env.MULE_ROOT }}/${{ matrix.app }}
        run: |
          JAR=$(ls target/*-mule-application.jar | head -1)
          echo "Inspecting $JAR"
          for must_have in config.yaml secure-config.yaml; do
            if ! unzip -l "$JAR" | grep -q " $must_have\$"; then
              echo "FAIL: $must_have missing from packaged jar"
              exit 1
            fi
          done
          echo "OK: config.yaml + secure-config.yaml both present in jar root"

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-jar
          path: ${{ env.MULE_ROOT }}/${{ matrix.app }}/target/*-mule-application.jar
          retention-days: 7

  # ── 2. Boot-time smoke test in Mule 4.9 EE runtime container ─
  # Requires MULESOFT_REGISTRY_USER / MULESOFT_REGISTRY_PASSWORD secrets set
  # in the repo settings. Without them, this job is skipped (not failed) so
  # the gate remains honest rather than falsely green.
  smoke:
    name: "Mule 4.9 boot smoke — ${{ matrix.app }}"
    runs-on: ubuntu-latest
    needs: package
    if: >
      ${{ secrets.MULESOFT_REGISTRY_USER != '' &&
          secrets.MULESOFT_REGISTRY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        app: [submit-order, initiate-wire, order-status-webhook]
    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-jar
          path: /tmp/jar

      - name: Docker login to MuleSoft registry
        run: |
          echo "${{ secrets.MULESOFT_REGISTRY_PASSWORD }}" | \
            docker login mcr.mulesoft.com \
              -u "${{ secrets.MULESOFT_REGISTRY_USER }}" --password-stdin

      - name: Boot Mule 4.9 with app mounted, tail for DEPLOYED|FAILED
        run: |
          JAR=$(ls /tmp/jar/*.jar | head -1)
          echo "Booting mule/runtime:4.9.0 with $(basename "$JAR")"
          docker run --rm -d --name mule-smoke \
            -v "$JAR":/opt/mule/apps/$(basename "$JAR") \
            -e MULE_SECURE_PROPERTIES_KEY=test1234test1234 \
            -e mock_mode=true \
            mcr.mulesoft.com/mule-runtime:4.9.0
          deadline=$((SECONDS+60))
          while [ $SECONDS -lt $deadline ]; do
            LOGS=$(docker logs mule-smoke 2>&1 || true)
            if echo "$LOGS" | grep -qE "DEPLOYED|is deployed"; then
              echo "OK: app deployed cleanly"
              docker stop mule-smoke >/dev/null
              exit 0
            fi
            if echo "$LOGS" | grep -qE "FAILED|A Fatal error has occurred"; then
              echo "FAIL: app crashed during boot"
              echo "--- last 50 lines of runtime log ---"
              echo "$LOGS" | tail -50
              docker stop mule-smoke >/dev/null
              exit 1
            fi
            sleep 2
          done
          echo "FAIL: app neither deployed nor failed within 60s"
          docker logs mule-smoke | tail -80
          docker stop mule-smoke >/dev/null
          exit 1
