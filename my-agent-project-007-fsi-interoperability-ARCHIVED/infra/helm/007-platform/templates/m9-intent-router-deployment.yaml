{{- if .Values.m9IntentRouter.enabled }}
# M9 Intent Router — LLM function calling with FSI taxonomy
# Depends on M1 for identity, routes to M6/M8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "007-platform.fullname" . }}-m9-intent-router
  labels:
    {{- include "007-platform.labels" . | nindent 4 }}
    {{- include "007-platform.selectorLabels" (dict "module" "m9-intent-router" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.m9IntentRouter.replicas }}
  selector:
    matchLabels:
      {{- include "007-platform.selectorLabels" (dict "module" "m9-intent-router" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "007-platform.labels" . | nindent 8 }}
        {{- include "007-platform.selectorLabels" (dict "module" "m9-intent-router" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: m9-intent-router
          image: {{ include "007-platform.image" (dict "image" .Values.m9IntentRouter.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.m9IntentRouter.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.m9IntentRouter.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: AGENT_RUNTIME
              value: {{ .Values.global.agentRuntime | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.global.llmProvider | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.global.awsRegion | quote }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_PATH
              value: "/etc/certs/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/certs/tls.key"
            {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.m9IntentRouter.resources | nindent 12 }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ include "007-platform.fullname" . }}-m9-intent-router-tls
      {{- end }}
---
{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "007-platform.fullname" . }}-m9-intent-router-tls
  labels:
    {{- include "007-platform.labels" . | nindent 4 }}
spec:
  secretName: {{ include "007-platform.fullname" . }}-m9-intent-router-tls
  duration: {{ .Values.tls.duration }}
  renewBefore: {{ .Values.tls.renewBefore }}
  issuerRef:
    name: {{ .Values.tls.issuerName }}
    kind: {{ .Values.tls.issuerKind }}
  dnsNames:
    - {{ include "007-platform.fullname" . }}-m9-intent-router
    - {{ include "007-platform.fullname" . }}-m9-intent-router.{{ .Release.Namespace }}.svc
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "007-platform.fullname" . }}-m9-intent-router
  labels:
    {{- include "007-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.m9IntentRouter.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "007-platform.selectorLabels" (dict "module" "m9-intent-router" "context" .) | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "007-platform.fullname" . }}-m9-intent-router
spec:
  podSelector:
    matchLabels:
      {{- include "007-platform.selectorLabels" (dict "module" "m9-intent-router" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # M12 agent-runtime routes classified intents to M9
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m12-agent-runtime
      ports:
        - port: {{ .Values.m9IntentRouter.port }}
  egress:
    - to:
        # M1 for identity verification
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m1-identity
        # M6 gateway for MCP calls (Rule 4)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m6-mcp-gateway
{{- end }}
