AWSTemplateFormatVersion: '2010-09-09'
Description: |
  M13 FIX Bridge — AWS resources.
  Owner: tier-2/5 team (stateful; specialist contractor).

  Resources:
    - FIX session DynamoDB table (sequence numbers + session state)
    - Secrets Manager secret (per-counterparty FIX logon credentials)

  Depends on: platform-common.

Parameters:
  Prefix:       { Type: String, Default: fsi007 }
  Environment:  { Type: String, Default: dev }

Resources:

  FixSessions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Prefix}-${Environment}-m13-fix-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !ImportValue '007-platform-KmsKeyId'
      Tags:
        - { Key: project, Value: '007' }
        - { Key: environment, Value: !Ref Environment }
        - { Key: module, Value: m13-fix-bridge }

  FixCounterpartyCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${Prefix}/${Environment}/m13/counterparty-credentials'
      Description: 'FIX counterparty Logon username/password JSON object. Populated out-of-band.'
      KmsKeyId: !ImportValue '007-platform-KmsKeyArn'
      Tags:
        - { Key: project, Value: '007' }
        - { Key: environment, Value: !Ref Environment }
        - { Key: module, Value: m13-fix-bridge }

Outputs:
  FixSessionsTableName:
    Value: !Ref FixSessions
    Export: { Name: '007-m13-fix-bridge-FixSessionsTableName' }
  FixSessionsTableArn:
    Value: !GetAtt FixSessions.Arn
    Export: { Name: '007-m13-fix-bridge-FixSessionsTableArn' }
  FixCounterpartyCredentialsArn:
    Value: !Ref FixCounterpartyCredentials
    Export: { Name: '007-m13-fix-bridge-FixCounterpartyCredentialsArn' }
