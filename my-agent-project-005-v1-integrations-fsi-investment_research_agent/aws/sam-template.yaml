AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Investment Research Agent — MCP Servers + Strands Agents (Sprint 2-3)
  Deploys 3 Lambda-backed MCP servers and 2 analysis agents behind API Gateway:
  SEC EDGAR, Market Data, News Search, Financial Analysis, Sentiment Analysis.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage name
  ApiKeyValue:
    Type: String
    NoEcho: true
    Description: API key value for authenticating requests (required)
  SecEdgarUserAgent:
    Type: String
    Default: placeholder@example.com
    Description: User-Agent header for SEC EDGAR API compliance
  AlphaVantageApiKey:
    Type: String
    NoEcho: true
    Default: PLACEHOLDER
    Description: Alpha Vantage API key for market data
  TavilyApiKey:
    Type: String
    NoEcho: true
    Default: PLACEHOLDER
    Description: Tavily API key for news search

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.10

Resources:
  # ---------- OAuth Token Proxy (Sprint 4) ----------
  TokenProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-token-proxy-${Stage}"
      Handler: app.lambda_handler
      CodeUri: token-proxy/
      Description: OAuth2 token exchange proxy — avoids CORS on Salesforce token endpoint
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          SF_TOKEN_URL: https://login.salesforce.com/services/oauth2/token
          ALLOWED_ORIGIN: !Sub "https://${FrontendDistribution.DomainName}"
      Events:
        TokenExchange:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /oauth/token
            Method: POST
            Auth:
              ApiKeyRequired: false
        TokenPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /oauth/token
            Method: OPTIONS
            Auth:
              ApiKeyRequired: false

  # ---------- API Gateway ----------
  InvestmentResearchApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "ir-mcp-api-${Stage}"
      StageName: !Ref Stage
      Auth:
        ApiKeyRequired: true

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - InvestmentResearchApiStage
    Properties:
      Name: !Sub "ir-mcp-api-key-${Stage}"
      Enabled: true
      Value: !Ref ApiKeyValue
      StageKeys:
        - RestApiId: !Ref InvestmentResearchApi
          StageName: !Ref Stage

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - InvestmentResearchApiStage
    Properties:
      UsagePlanName: !Sub "ir-mcp-usage-plan-${Stage}"
      ApiStages:
        - ApiId: !Ref InvestmentResearchApi
          Stage: !Ref Stage
      Throttle:
        BurstLimit: 50
        RateLimit: 25

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  # ---------- SEC EDGAR MCP Server ----------
  SecEdgarMcpServer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-sec-edgar-mcp-${Stage}"
      Handler: app.lambda_handler
      CodeUri: mcp-servers/sec-edgar/
      Description: MCP server for SEC EDGAR filings (10-K, 10-Q, 8-K, insider transactions)
      Environment:
        Variables:
          SEC_EDGAR_USER_AGENT: !Ref SecEdgarUserAgent
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /sec-edgar/{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true

  # ---------- Market Data MCP Server ----------
  MarketDataMcpServer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-market-data-mcp-${Stage}"
      Handler: app.lambda_handler
      CodeUri: mcp-servers/market-data/
      Description: MCP server for real-time stock quotes and market data
      Environment:
        Variables:
          ALPHA_VANTAGE_API_KEY: !Ref AlphaVantageApiKey
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /market-data/{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true

  # ---------- News Search MCP Server ----------
  NewsSearchMcpServer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-news-search-mcp-${Stage}"
      Handler: app.lambda_handler
      CodeUri: mcp-servers/news-search/
      Description: MCP server for financial news search and sentiment analysis
      Environment:
        Variables:
          TAVILY_API_KEY: !Ref TavilyApiKey
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /news-search/{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true

  # ---------- Financial Analysis Agent (Sprint 3) ----------
  FinancialAnalysisAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-financial-analysis-${Stage}"
      Handler: app.lambda_handler
      CodeUri: strands-agents/financial-analysis/
      Description: Financial Analysis Agent — DCF, comps, Monte Carlo, fair value
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-20250514-v1:0
          LANGFUSE_HOST: CONFIGURE_AFTER_DEPLOY
          LANGFUSE_PUBLIC_KEY: CONFIGURE_AFTER_DEPLOY
          LANGFUSE_SECRET_KEY: CONFIGURE_AFTER_DEPLOY
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /financial-analysis/{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true

  # ---------- Sentiment Analysis Agent (Sprint 3) ----------
  SentimentAnalysisAgent:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ir-sentiment-analysis-${Stage}"
      Handler: app.lambda_handler
      CodeUri: strands-agents/sentiment-analysis/
      Description: Sentiment Analysis Agent — transcript NLP, news sentiment, tone detection
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-20250514-v1:0
          NEWS_API_URL: CONFIGURE_AFTER_DEPLOY
          NEWS_API_KEY: CONFIGURE_AFTER_DEPLOY
          LANGFUSE_HOST: CONFIGURE_AFTER_DEPLOY
          LANGFUSE_PUBLIC_KEY: CONFIGURE_AFTER_DEPLOY
          LANGFUSE_SECRET_KEY: CONFIGURE_AFTER_DEPLOY
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref InvestmentResearchApi
            Path: /sentiment-analysis/{proxy+}
            Method: ANY
            Auth:
              ApiKeyRequired: true

  # ---------- Frontend Hosting (Sprint 4) ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ir-research-workbench-${Stage}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "ir-frontend-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Comment: !Sub "IR Research Workbench - ${Stage}"

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${InvestmentResearchApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  ApiKeyId:
    Description: API Key ID (retrieve value from AWS Console or CLI)
    Value: !Ref ApiKey
  FrontendUrl:
    Description: Frontend CloudFront URL
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
