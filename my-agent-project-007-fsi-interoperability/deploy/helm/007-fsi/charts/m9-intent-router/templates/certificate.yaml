{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: m9-intent-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m9-intent-router
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
spec:
  secretName: {{ .Values.mtls.secretName }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  commonName: m9-intent-router.{{ .Release.Namespace }}.svc.cluster.local
  dnsNames:
    - m9-intent-router.{{ .Release.Namespace }}.svc.cluster.local
    - m9-intent-router.{{ .Release.Namespace }}.svc
  usages:
    - server auth
    - client auth
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
{{- end }}
