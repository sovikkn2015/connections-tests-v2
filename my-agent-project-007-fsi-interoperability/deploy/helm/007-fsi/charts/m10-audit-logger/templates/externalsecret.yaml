apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "007.fullname" . }}-secrets
  labels:
    {{- include "007.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.global).externalSecrets).refreshInterval | default "1m" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ ((.Values.global).externalSecrets).storeName | default "vault-cluster-store" }}
  target:
    name: {{ include "007.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: S3_BUCKET
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m10-audit-logger/s3-writer" }}
        property: bucket
    - secretKey: LANGFUSE_HOST
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m10-audit-logger/s3-writer" }}
        property: langfuse_host
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m10-audit-logger/s3-writer" }}
        property: langfuse_public_key
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecretPath | default "secret/data/007/m10-audit-logger/s3-writer" }}
        property: langfuse_secret_key
