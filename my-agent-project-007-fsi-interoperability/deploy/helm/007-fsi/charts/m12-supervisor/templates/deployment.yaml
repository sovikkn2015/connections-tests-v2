apiVersion: apps/v1
kind: Deployment
metadata:
  name: m12-supervisor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: m12-supervisor
    app.kubernetes.io/part-of: 007-fsi
    app.kubernetes.io/component: intelligence
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: m12-supervisor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: m12-supervisor
        app.kubernetes.io/name: m12-supervisor
        app.kubernetes.io/part-of: 007-fsi
        app.kubernetes.io/component: intelligence
    spec:
      serviceAccountName: m12-supervisor
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: m12-supervisor
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: tls
              containerPort: 8443
              protocol: TCP
          # M12_KYC_ADAPTER_URL is wired explicitly via configMapKeyRef
          # (verification gate: URL via ConfigMap, not Secret).
          env:
            - name: M12_KYC_ADAPTER_URL
              valueFrom:
                configMapKeyRef:
                  name: m12-supervisor-config
                  key: M12_KYC_ADAPTER_URL
          envFrom:
            - configMapRef:
                name: m12-supervisor-config
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: tls
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: tls
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: mtls-cert
              mountPath: /etc/007/mtls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mtls-cert
          secret:
            secretName: {{ .Values.mtls.secretName }}
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
